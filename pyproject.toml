[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wisconsin_cancer_analysis"
version = "0.0.1"
description = "Analisis de datos sobre el cancer de mama"
authors = [
  { name = "MCD" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["wisconsin_cancer_analysis"]
include = ["pyproject.toml", "wisconsin_cancer_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["wisconsin_cancer_analysis"]
force-sort-within-sections = true

